plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.3.21'
}

group = 'com.gdssecurity'
version = '1.1-native-ws'

// Build with JDK 25, but emit Java 21 bytecode and APIs: PortSwigger requires extensions to target Java 21 or lower.
kotlin {
    jvmToolchain(25)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        freeCompilerArgs.add('-Xjdk-release=21')
    }
}

// No Java sources, but the Kotlin plugin requires matching Java and Kotlin JVM targets.
tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.msgpack:msgpack-core:0.9.3'
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.7'
    implementation 'org.json:json:20220924'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'net.portswigger.burp.extensions:montoya-api:2026.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    dependsOn jar
    systemProperty 'btp.jar', tasks.jar.archiveFile.get().asFile.absolutePath
    systemProperty 'java.awt.headless', 'true'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes "Main-Class": "com.gdssecurity.BlazorTrafficProcessor"
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
